name: WebSocket Load Chaos

on:
  workflow_dispatch:
    inputs:
      clients:
        description: Real WebSocket client count
        required: true
        default: '100'
        type: choice
        options:
          - '50'
          - '100'
          - '300'
      duration_seconds:
        description: Chaos traffic duration in seconds
        required: true
        default: '20'
        type: string
      netem_delay_ms:
        description: Kernel-level one-way delay on loopback
        required: true
        default: '80'
        type: string
      netem_jitter_ms:
        description: Kernel-level delay jitter
        required: true
        default: '30'
        type: string
      netem_loss_percent:
        description: Kernel-level packet loss percentage
        required: true
        default: '2'
        type: string
      storm_fraction:
        description: Fraction of clients dropped together per storm (0-1)
        required: true
        default: '0.50'
        type: string
      storm_count:
        description: Number of reconnect storms
        required: true
        default: '2'
        type: string

permissions:
  contents: read

jobs:
  load-chaos:
    name: ${{ inputs.clients }} clients / netem ${{ inputs.netem_delay_ms }}ms / loss ${{ inputs.netem_loss_percent }}%
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    env:
      CLIENTS: ${{ inputs.clients }}
      DURATION_SECONDS: ${{ inputs.duration_seconds }}
      NETEM_DELAY_MS: ${{ inputs.netem_delay_ms }}
      NETEM_JITTER_MS: ${{ inputs.netem_jitter_ms }}
      NETEM_LOSS_PERCENT: ${{ inputs.netem_loss_percent }}
      STORM_FRACTION: ${{ inputs.storm_fraction }}
      STORM_COUNT: ${{ inputs.storm_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.10'
          cache-dependency-path: server/go.sum
      - name: Build server and load driver
        run: |
          go build -o /tmp/cellular-server ./cmd/server
          go build -o /tmp/cellular-wsload ./cmd/wsload
      - name: Run kernel-level weak-network load test
        env:
          HTTP_ADDR: 127.0.0.1:18082
          WS_HOST: 127.0.0.1:18082
          STORAGE: memory
          GAME_COUNTDOWN_SECONDS: '0'
          GAME_BOTS: '0'
          GAME_INIT_MASS: '20'
          GAME_AOI_ENABLED: 'true'
          GAME_AOI_FULL_INTERVAL_SECONDS: '5'
          MATCH_MAX_WAIT_SECONDS: '8'
          ALLOW_LOOPBACK_ORIGINS: 'true'
        run: |
          set -euo pipefail

          min_players="$CLIENTS"
          if [ "$min_players" -gt 100 ]; then
            min_players=100
          fi
          export MATCH_MIN_PLAYERS="$min_players"
          export GAME_BATTLE_SECONDS=$((DURATION_SECONDS + 45))

          /tmp/cellular-server >/tmp/cellular-load-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            status=$?
            sudo tc qdisc del dev lo root 2>/dev/null || true
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then
              echo '--- server log tail ---'
              tail -n 500 /tmp/cellular-load-server.log || true
            fi
            exit "$status"
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 150); do
            if curl -fsS http://127.0.0.1:18082/healthz >/dev/null; then
              ready=1
              break
            fi
            sleep 0.1
          done
          if [ "$ready" -ne 1 ]; then
            echo 'server did not become healthy'
            exit 1
          fi

          if ! command -v tc >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y iproute2
          fi

          sudo tc qdisc replace dev lo root netem \
            delay "${NETEM_DELAY_MS}ms" "${NETEM_JITTER_MS}ms" distribution normal \
            loss "${NETEM_LOSS_PERCENT}%"
          echo '--- active netem ---'
          tc qdisc show dev lo

          /tmp/cellular-wsload \
            -base-url http://127.0.0.1:18082 \
            -ws-url ws://127.0.0.1:18082/ws \
            -clients "$CLIENTS" \
            -duration "${DURATION_SECONDS}s" \
            -move-interval 200ms \
            -latency 0ms \
            -jitter 0ms \
            -incoming-drop-rate 0.01 \
            -outgoing-drop-rate 0.01 \
            -storm-fraction "$STORM_FRACTION" \
            -storm-count "$STORM_COUNT" \
            -churn-fraction 0.01 \
            -reconnect-jitter 800ms \
            -setup-concurrency 100 \
            -match-timeout 20s \
            -min-reconnect-success 0.95 \
            -min-snapshot-healthy 0.95 \
            | tee /tmp/ws-load-chaos-report.txt
      - name: Upload load report and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws-load-chaos-${{ inputs.clients }}-clients
          path: |
            /tmp/ws-load-chaos-report.txt
            /tmp/cellular-load-server.log
          if-no-files-found: ignore
