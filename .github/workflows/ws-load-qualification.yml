name: WebSocket Load Qualification

on:
  pull_request:

permissions:
  contents: read

jobs:
  netem-100:
    if: github.head_ref == 'feature/ws-load-chaos'
    name: 100 clients / real netem weak network
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.10'
          cache-dependency-path: server/go.sum
      - name: Build
        run: |
          go build -o /tmp/cellular-server ./cmd/server
          go build -o /tmp/cellular-wsload ./cmd/wsload
      - name: Run 100 clients through tc netem
        env:
          HTTP_ADDR: 127.0.0.1:18083
          WS_HOST: 127.0.0.1:18083
          STORAGE: memory
          GAME_BATTLE_SECONDS: '60'
          GAME_COUNTDOWN_SECONDS: '0'
          GAME_BOTS: '0'
          GAME_INIT_MASS: '20'
          GAME_AOI_ENABLED: 'true'
          GAME_AOI_FULL_INTERVAL_SECONDS: '5'
          MATCH_MIN_PLAYERS: '100'
          MATCH_MAX_WAIT_SECONDS: '8'
          ALLOW_LOOPBACK_ORIGINS: 'true'
        run: |
          set -euo pipefail
          /tmp/cellular-server >/tmp/wsload-100-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            status=$?
            sudo tc qdisc del dev lo root 2>/dev/null || true
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then
              tail -n 500 /tmp/wsload-100-server.log || true
            fi
            exit "$status"
          }
          trap cleanup EXIT
          for _ in $(seq 1 150); do
            if curl -fsS http://127.0.0.1:18083/healthz >/dev/null; then break; fi
            sleep 0.1
          done
          command -v tc >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y iproute2; }
          sudo tc qdisc replace dev lo root netem delay 60ms 20ms distribution normal loss 1%
          tc qdisc show dev lo
          /tmp/cellular-wsload \
            -base-url http://127.0.0.1:18083 \
            -ws-url ws://127.0.0.1:18083/ws \
            -clients 100 \
            -duration 12s \
            -move-interval 200ms \
            -latency 0ms \
            -jitter 0ms \
            -incoming-drop-rate 0.01 \
            -outgoing-drop-rate 0.01 \
            -storm-fraction 0.50 \
            -storm-count 2 \
            -churn-fraction 0.01 \
            -reconnect-jitter 800ms \
            -setup-concurrency 100 \
            -match-timeout 20s \
            -min-reconnect-success 0.95 \
            -min-snapshot-healthy 0.95 \
            | tee /tmp/wsload-100-report.txt
      - name: Upload 100-client report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wsload-qualification-100
          path: |
            /tmp/wsload-100-report.txt
            /tmp/wsload-100-server.log
          if-no-files-found: ignore

  stress-300:
    if: github.head_ref == 'feature/ws-load-chaos'
    name: 300 clients / 3-room reconnect storm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.10'
          cache-dependency-path: server/go.sum
      - name: Build
        run: |
          go build -o /tmp/cellular-server ./cmd/server
          go build -o /tmp/cellular-wsload ./cmd/wsload
      - name: Run 300 real WebSocket clients
        env:
          HTTP_ADDR: 127.0.0.1:18084
          WS_HOST: 127.0.0.1:18084
          STORAGE: memory
          GAME_BATTLE_SECONDS: '60'
          GAME_COUNTDOWN_SECONDS: '0'
          GAME_BOTS: '0'
          GAME_INIT_MASS: '20'
          GAME_AOI_ENABLED: 'true'
          GAME_AOI_FULL_INTERVAL_SECONDS: '5'
          MATCH_MIN_PLAYERS: '100'
          MATCH_MAX_WAIT_SECONDS: '8'
          ALLOW_LOOPBACK_ORIGINS: 'true'
        run: |
          set -euo pipefail
          /tmp/cellular-server >/tmp/wsload-300-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            status=$?
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then
              tail -n 800 /tmp/wsload-300-server.log || true
            fi
            exit "$status"
          }
          trap cleanup EXIT
          for _ in $(seq 1 150); do
            if curl -fsS http://127.0.0.1:18084/healthz >/dev/null; then break; fi
            sleep 0.1
          done
          /tmp/cellular-wsload \
            -base-url http://127.0.0.1:18084 \
            -ws-url ws://127.0.0.1:18084/ws \
            -clients 300 \
            -duration 12s \
            -move-interval 250ms \
            -latency 20ms \
            -jitter 30ms \
            -incoming-drop-rate 0.02 \
            -outgoing-drop-rate 0.02 \
            -storm-fraction 0.50 \
            -storm-count 2 \
            -churn-fraction 0.01 \
            -reconnect-jitter 1000ms \
            -setup-concurrency 100 \
            -match-timeout 25s \
            -min-reconnect-success 0.95 \
            -min-snapshot-healthy 0.95 \
            | tee /tmp/wsload-300-report.txt
      - name: Upload 300-client report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wsload-qualification-300
          path: |
            /tmp/wsload-300-report.txt
            /tmp/wsload-300-server.log
          if-no-files-found: ignore
