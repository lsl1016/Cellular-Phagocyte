name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  server:
    name: Go server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.10'
          cache-dependency-path: server/go.sum
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./cmd/server

  cocos-core-smoke:
    name: Cocos core smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.10'
          cache-dependency-path: server/go.sum
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client-cocos/package-lock.json
      - name: Install dependencies
        working-directory: client-cocos
        run: npm ci
      - name: Run smoke tests
        working-directory: client-cocos
        run: npm test

  legacy-h5-smoke:
    name: Legacy H5 smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.10'
          cache-dependency-path: server/go.sum
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        working-directory: client
        run: npm ci
      - name: Build
        working-directory: client
        run: npm run build
      - name: Run smoke tests
        working-directory: client
        run: npm run smoke
