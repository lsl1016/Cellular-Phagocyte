name: WebSocket Soak Capacity

on:
  workflow_dispatch:
    inputs:
      clients:
        description: Real WebSocket client count
        required: true
        default: '300'
        type: choice
        options:
          - '100'
          - '300'
          - '500'
      duration_seconds:
        description: Sustained traffic duration in seconds
        required: true
        default: '300'
        type: string
      netem_delay_ms:
        description: Optional kernel-level one-way delay
        required: true
        default: '0'
        type: string
      netem_jitter_ms:
        description: Optional kernel-level delay jitter
        required: true
        default: '0'
        type: string
      netem_loss_percent:
        description: Optional kernel-level packet loss percentage
        required: true
        default: '0'
        type: string
      storm_fraction:
        description: Fraction of clients dropped together per storm
        required: true
        default: '0.30'
        type: string
      storm_count:
        description: Reconnect storms during the run
        required: true
        default: '5'
        type: string

permissions:
  contents: read

jobs:
  soak:
    name: ${{ inputs.clients }} clients / ${{ inputs.duration_seconds }}s soak
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    env:
      CLIENTS: ${{ inputs.clients }}
      DURATION_SECONDS: ${{ inputs.duration_seconds }}
      NETEM_DELAY_MS: ${{ inputs.netem_delay_ms }}
      NETEM_JITTER_MS: ${{ inputs.netem_jitter_ms }}
      NETEM_LOSS_PERCENT: ${{ inputs.netem_loss_percent }}
      STORM_FRACTION: ${{ inputs.storm_fraction }}
      STORM_COUNT: ${{ inputs.storm_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.10'
          cache-dependency-path: server/go.sum
      - name: Build server and load driver
        run: |
          go build -o /tmp/cellular-server ./cmd/server
          go build -o /tmp/cellular-wsload ./cmd/wsload
      - name: Run soak capacity test
        env:
          HTTP_ADDR: 127.0.0.1:18083
          WS_HOST: 127.0.0.1:18083
          STORAGE: memory
          GAME_COUNTDOWN_SECONDS: '0'
          GAME_BOTS: '0'
          GAME_INIT_MASS: '20'
          # Capacity baseline deliberately disables food. With equal player mass this prevents
          # gameplay elimination from being misclassified as transport/reconnect failure.
          GAME_INITIAL_FOOD_COUNT: '0'
          GAME_MAX_FOOD_COUNT: '0'
          GAME_AOI_ENABLED: 'true'
          GAME_AOI_FULL_INTERVAL_SECONDS: '5'
          MATCH_MAX_WAIT_SECONDS: '12'
          ALLOW_LOOPBACK_ORIGINS: 'true'
          ENABLE_RUNTIME_METRICS: 'true'
        run: |
          set -euo pipefail

          min_players="$CLIENTS"
          if [ "$min_players" -gt 100 ]; then
            min_players=100
          fi
          export MATCH_MIN_PLAYERS="$min_players"
          export GAME_BATTLE_SECONDS=$((DURATION_SECONDS + 60))

          /tmp/cellular-server >/tmp/cellular-soak-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            status=$?
            sudo tc qdisc del dev lo root 2>/dev/null || true
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then
              echo '--- server log tail ---'
              tail -n 500 /tmp/cellular-soak-server.log || true
            fi
            exit "$status"
          }
          trap cleanup EXIT

          for _ in $(seq 1 150); do
            if curl -fsS http://127.0.0.1:18083/healthz >/dev/null; then
              break
            fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:18083/healthz >/dev/null
          curl -fsS http://127.0.0.1:18083/debug/runtime | head -c 1000
          echo

          if [ "$NETEM_DELAY_MS" != '0' ] || [ "$NETEM_JITTER_MS" != '0' ] || [ "$NETEM_LOSS_PERCENT" != '0' ]; then
            if ! command -v tc >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y iproute2
            fi
            sudo tc qdisc replace dev lo root netem \
              delay "${NETEM_DELAY_MS}ms" "${NETEM_JITTER_MS}ms" distribution normal \
              loss "${NETEM_LOSS_PERCENT}%"
            echo '--- active netem ---'
            tc qdisc show dev lo
          fi

          /tmp/cellular-wsload \
            -base-url http://127.0.0.1:18083 \
            -ws-url ws://127.0.0.1:18083/ws \
            -clients "$CLIENTS" \
            -duration "${DURATION_SECONDS}s" \
            -move-interval 200ms \
            -latency 0ms \
            -jitter 0ms \
            -incoming-drop-rate 0.005 \
            -outgoing-drop-rate 0.005 \
            -storm-fraction "$STORM_FRACTION" \
            -storm-count "$STORM_COUNT" \
            -churn-fraction 0.005 \
            -reconnect-jitter 1000ms \
            -setup-concurrency 150 \
            -match-timeout 30s \
            -min-reconnect-success 0.99 \
            -min-snapshot-healthy 0.99 \
            -server-metrics-url http://127.0.0.1:18083/debug/runtime \
            -metrics-interval 1s \
            -timeseries-csv /tmp/ws-soak-timeseries.csv \
            | tee /tmp/ws-soak-report.txt
      - name: Upload soak report, runtime CSV and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws-soak-${{ inputs.clients }}-clients-${{ inputs.duration_seconds }}s
          path: |
            /tmp/ws-soak-report.txt
            /tmp/ws-soak-timeseries.csv
            /tmp/cellular-soak-server.log
          if-no-files-found: ignore
